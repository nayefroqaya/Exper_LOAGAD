# Original DeepLog predictor: one training/checkpoint, two test evaluation modes.
# Dataset selection and root can be overridden from command line.
dataset_name: BGL
#data_dir: /storage/home/roqaya/LWADLS/datasets
data_dir: /storage/home/roqaya/Exper_LOAGAD/dataset/BGL

embeddings: embeddings_tfidf.json
# BGL/TH/SP fixed non-overlapping 120-event sequences; for HDFS use grouping: session
grouping: sliding
session_level: entry
sequential: true
semantic: false
quantitative: false
window_size: 120
step_size: 120
history_size: 120
model_name: DeepLog
embedding_dim: 300
dropout: 0.1
hidden_size: 128
num_layers: 2
topk: 9
optimizer: adam
adam_beta1: 0.9
adam_beta2: 0.999
max_epoch: 20
output_dir: ./output_deeplog_standard_online
resume: false
train: true
remove_duplicates: true
# Original TRAIN is not augmented; original next-event loss is preserved.
early_eval_stride: 1
early_prefix_min_events: 2
fp_unit_cost: 10.0
fn_unit_cost: 20.0
delay_unit_cost: 5.0
