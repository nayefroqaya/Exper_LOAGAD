# dataset configuration
#data_dir: ./datasets/SP_150MB_ratio
data_dir:  ../LWADLS/datasets/HDFS  # -------------------Change here
dataset_name:  HDFS     # -------------------Change here
#log_file: .log
embeddings: embeddings_tfidf.json

# data preprocessing
grouping:  session # sliding  # sliding #session . # -------------------Change here for HDFS session
session_level: entry
sequential: true
semantic: false
quantitative: false

# model configuration
model_name: DeepLog
embedding_dim: 300
dropout: 0.1
hidden_size: 128
num_layers: 2
topk: 9

# optimizer configuration
optimizer: adam
adam_beta1: 0.9
adam_beta2: 0.999
max_epoch: 20

# common configuration
output_dir: ./output/
resume: false
#train_size: 0.6 #0.01
#valid_ratio: 0.1
train: true
remove_duplicates: true
