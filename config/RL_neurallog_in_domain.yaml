# dataset configuration
#data_dir: ./dataset/SP_150MB_ratio
data_dir:  ../LWADLS/datasets/SP_150MB_ratio  # -------------------Change here
dataset_name:  SP_150MB_ratio             # -------------------Change here
#log_file: .log
embeddings: embeddings_tfidf.json

# data preprocessing
grouping: sliding  # sliding  # sliding #session .  # -------------------Change here
session_level: entry
sequential: false
semantic: true
quantitative: false
history_size: 120
window_size: 120
step_size: 120

# model configuration
model_name: NeuralLog
embedding_dim: 300
dropout: 0.1
dim_feedforward: 2048
num_heads: 4
num_layers: 2
n_class: 2

# optimizer configuration
optimizer: adam
adam_beta1: 0.9
adam_beta2: 0.999
epsilon: 1.0e-08
lr: 0.001
optim_momentum: 0.99
scheduler: linear
warmup_rate: 0.1
weight_decay: 0.0

# training configuration
accumulation_step: 2
batch_size: 512
max_epoch: 10

# common configuration
output_dir: ./output/
resume: false
#train_size: 0.6  #  0.01
#valid_ratio: 0.1
train: true

# Native full-window early-detection reporting
real_early_detection: true
early_eval_stride: 1

# RL cost settings
fp_unit_cost: 10.0
fn_unit_cost: 20.0
delay_unit_cost: 5.0

